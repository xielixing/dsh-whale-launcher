<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Harness 启动器</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #f7f9fd 0%, #ffffff 60%);
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #1a2233;
}
.card {
  width: min(92vw, 460px); background: #ffffff; border: 1px solid #e3e9f2;
  border-radius: 24px; padding: 40px 32px 28px; text-align: center;
  box-shadow: 0 18px 50px rgba(30, 64, 120, .10);
}
h1 { font-size: 22px; margin: 0 0 6px; font-weight: 600; letter-spacing: .5px; color: #141b2b; }
.sub { font-size: 13px; color: #5b6b84; margin: 0 0 22px; }
.whale-wrap { position: relative; display: inline-block; margin: 8px 0 18px; }
.whale-btn {
  background: none; border: none; cursor: pointer; padding: 0; outline: none;
  display: inline-flex; transition: transform .18s ease;
}
.whale-btn:hover { transform: translateY(-4px) scale(1.03); }
.whale-btn:active { transform: scale(.97); }
.whale-btn .fish {
  color: #101418;
  filter: drop-shadow(0 8px 18px rgba(30, 64, 120, .18));
  transition: color .3s ease, filter .3s ease;
}
.whale-btn.spouting .fish {
  color: #1e80ff;
  filter: drop-shadow(0 6px 16px rgba(30, 128, 255, .35));
  animation: bob 1.5s ease-in-out infinite;
}
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* water column rising from the blowhole */
.spout-column {
  position: absolute; left: 116px; top: -36px; width: 5px; height: 30px;
  background: linear-gradient(to top, rgba(30, 128, 255, .95), rgba(30, 128, 255, 0));
  border-radius: 3px; transform-origin: bottom center; display: none;
}
.spouting .spout-column { display: block; animation: column 1.5s ease-in-out infinite; }
@keyframes column {
  0%, 100% { transform: scaleY(1) skewX(0deg); opacity: .85; }
  50% { transform: scaleY(1.35) skewX(4deg); opacity: 1; }
}

/* spray particles arcing out of the column */
.drop {
  position: absolute; left: 118px; top: -34px; background: #1e80ff;
  border-radius: 50% 50% 55% 55%; opacity: 0; display: none;
}
.spouting .drop { display: block; animation: spout 1.5s cubic-bezier(.2, .6, .4, 1) infinite; animation-delay: var(--d, 0s); }
@keyframes spout {
  0% { transform: translate(0, 0) scale(.55) rotate(0deg); opacity: 0; }
  12% { opacity: .95; }
  65% { opacity: .75; }
  100% { transform: translate(var(--dx, 0), var(--dy, -52px)) scale(1) rotate(14deg); opacity: 0; }
}

/* mist puff at the blowhole */
.mist {
  position: absolute; left: 116px; top: -30px; width: 12px; height: 12px;
  border-radius: 50%; background: rgba(30, 128, 255, .30); filter: blur(1.5px);
  opacity: 0; display: none;
}
.spouting .mist { display: block; animation: mist 1.5s ease-out infinite; animation-delay: var(--d, 0s); }
@keyframes mist {
  0% { transform: scale(.5); opacity: 0; }
  30% { opacity: .8; }
  100% { transform: scale(2.4); opacity: 0; }
}

#status { font-size: 15px; min-height: 22px; margin: 0 0 18px; color: #2b3850; }
#status.error { color: #d4380d; }
.settings { text-align: left; border-top: 1px solid #edf1f7; padding-top: 16px; margin-top: 4px; }
.settings label { font-size: 12px; color: #5b6b84; display: block; margin-bottom: 6px; }
.row { display: flex; gap: 8px; }
.row input {
  flex: 1; background: #fbfcfe; border: 1px solid #d4dde9;
  border-radius: 10px; padding: 9px 12px; color: #1a2233; font-size: 13px; outline: none;
}
.row input:focus { border-color: #1e80ff; }
.row button {
  border: 1px solid #b9d4f5; background: #eef4ff; color: #1d5fc4;
  border-radius: 10px; padding: 9px 16px; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.row button:hover { background: #dceaff; }
.hint { font-size: 12px; color: #8596ad; margin-top: 14px; line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
  <h1>DeepSeek Harness</h1>
  <p class="sub">点击鲸鱼 · 喷水完成后自动启动并进入</p>
  <div class="whale-wrap" id="whaleWrap">
    <button class="whale-btn" id="whaleBtn" type="button" title="点击启动 DeepSeek Harness">
      <svg class="fish" width="170" height="125" viewBox="0 0 23.16 17.04" fill="none" aria-hidden="true">
        <path d="M22.9168 1.43018C22.6713 1.31018 22.5658 1.53918 22.4223 1.65519C22.3733 1.69269 22.3318 1.74169 22.2903 1.78669C21.9317 2.1697 21.5127 2.42121 20.9657 2.39121C20.1657 2.34621 19.4827 2.59771 18.8787 3.20973C18.7502 2.45521 18.3236 2.0047 17.6746 1.71569C17.3351 1.56568 16.9916 1.41518 16.7536 1.08867C16.5876 0.856163 16.5421 0.597155 16.4591 0.341647C16.4061 0.187643 16.3536 0.0301382 16.1761 0.00363739C15.9836 -0.0263635 15.9081 0.135141 15.8326 0.270145C15.5306 0.822162 15.4136 1.43018 15.4251 2.0462C15.4516 3.43174 16.0366 4.53527 17.1991 5.3203C17.3311 5.4103 17.3651 5.5003 17.3236 5.63181C17.2441 5.90231 17.1501 6.16482 17.0671 6.43533C17.0141 6.60784 16.9351 6.64584 16.7501 6.57033C16.1121 6.30383 15.5611 5.90931 15.074 5.4328C14.2475 4.63328 13.5 3.75075 12.568 3.05973C12.349 2.89822 12.13 2.74822 11.9034 2.60522C10.9524 1.68169 12.028 0.923165 12.277 0.833162C12.5375 0.739159 12.3675 0.41615 11.5259 0.42015C10.6844 0.42365 9.91439 0.705658 8.93286 1.08117C8.78935 1.13767 8.63835 1.17867 8.48384 1.21267C7.59332 1.04367 6.66829 1.00617 5.70226 1.11517C3.88321 1.31768 2.43016 2.1777 1.36213 3.64575C0.0790928 5.4103 -0.222916 7.41536 0.146595 9.50642C0.535106 11.7105 1.66014 13.535 3.38869 14.9616C5.18125 16.4406 7.24581 17.1657 9.60138 17.0266C11.0319 16.9441 12.6245 16.7526 14.421 15.2321C14.874 15.4576 15.3496 15.5476 16.1381 15.6151C16.7456 15.6716 17.3306 15.5851 17.7836 15.4911C18.4931 15.3411 18.4441 14.6841 18.1876 14.5636C16.1081 13.595 16.5646 13.9891 16.1496 13.67C17.2061 12.42 18.8202 10.1979 19.3182 7.17235C19.3672 6.83834 19.4297 6.36783 19.4222 6.09732C19.4182 5.93231 19.4562 5.86831 19.6447 5.84931C20.1657 5.78931 20.6712 5.64681 21.1357 5.3913C22.4833 4.65528 23.0268 3.44624 23.1548 1.9972C23.1738 1.77569 23.1508 1.54668 22.9168 1.43018ZM11.1749 14.4736C9.15936 12.889 8.18184 12.3675 7.77832 12.39C7.40081 12.4125 7.46881 12.8445 7.55182 13.126C7.63882 13.404 7.75182 13.5955 7.91033 13.8396C8.01983 14.0011 8.09533 14.2411 7.8008       </svg>
      <span class="spout-column"></span>
      <span class="drop" style="--dx:-20px; --dy:-30px; --d:0s; width:4px; height:7px;"></span>
      <span class="drop" style="--dx:-14px; --dy:-46px; --d:.12s; width:5px; height:9px;"></span>
      <span class="drop" style="--dx:-7px;  --dy:-58px; --d:.24s; width:5px; height:9px;"></span>
      <span class="drop" style="--dx:0;    --dy:-64px; --d:.38s; width:6px; height:10px;"></span>
      <span class="drop" style="--dx:7px;   --dy:-56px; --d:.52s; width:5px; height:9px;"></span>
      <span class="drop" style="--dx:14px;  --dy:-44px; --d:.66s; width:5px; height:9px;"></span>
      <span class="drop" style="--dx:20px;  --dy:-28px; --d:.8s; width:4px; height:7px;"></span>
      <span class="mist" style="--d:.1s;"></span>
      <span class="mist" style="--d:.55s;"></span>
      <span class="mist" style="--d:1s;"></span>
    </button>
  </div>
  <div id="status">就绪，等待启动</div>
  <div class="settings">
    <label for="dirInput">本地 dsh 目录（保存后下次默认使用）</label>
    <div class="row">
      <input id="dirInput" type="text" spellcheck="false" placeholder="例如 D:\deepseek-harness">
      <button id="saveBtn" type="button">保存</button>
    </div>
  </div>
  <p class="hint">首次使用：请先双击运行仓库里的 install.bat 一次。<br>启动窗口会最小化，关闭它即停止服务。</p>
</div>
<script>
(function () {
  var DIR_KEY = 'dshLaunchDir'
  var WEB_URL = 'http://127.0.0.1:3080/'
  var SPOUT_MS = 2400
  var input = document.getElementById('dirInput')
  var status = document.getElementById('status')
  var btn = document.getElementById('whaleBtn')
  var wrap = document.getElementById('whaleWrap')
  var saved = null
  try { saved = localStorage.getItem(DIR_KEY) } catch (e) {}
  if (saved) input.value = saved

  function setStatus(text, isError) {
    status.textContent = text
    if (isError) { status.classList.add('error') } else { status.classList.remove('error') }
  }
  function probe() {
    return fetch(WEB_URL, { mode: 'no-cors', cache: 'no-store' }).then(function () { return true }, function () { return false })
  }
  function saveDir() {
    var v = input.value.trim()
    if (!v) { setStatus('目录不能为空', true); return }
    try { localStorage.setItem(DIR_KEY, v) } catch (e) {}
    setStatus('目录已保存：' + v)
  }
  document.getElementById('saveBtn').addEventListener('click', saveDir)

  function startSpout() { wrap.classList.add('spouting') }
  function stopSpout() { wrap.classList.remove('spouting') }
  function jumpIn() {
    stopSpout()
    setStatus('启动完成，正在进入 DeepSeek Harness …')
    setTimeout(function () { window.location.href = WEB_URL }, 900)
  }
  function waitReady(tries, delay) {
    return new Promise(function (resolve) {
      var n = 0
      ;(function tick() {
        n++
        if (n > tries) return resolve(false)
        probe().then(function (ok) {
          if (ok) { resolve(true); return }
          setTimeout(tick, delay)
        }, function () { setTimeout(tick, delay) })
      })()
    })
  }

  var busy = false
  btn.addEventListener('click', function () {
    if (busy) return
    busy = true
    var dir = input.value.trim()
    if (!dir) { setStatus('请先填写 dsh 目录并保存', true); busy = false; return }
    try { localStorage.setItem(DIR_KEY, dir) } catch (e) {}
    probe().then(function (alreadyUp) {
      if (alreadyUp) { jumpIn(); busy = false; return }
      startSpout()
      setStatus('正在喷水，准备启动 …')
      // 喷水一轮完成后才真正触发启动
      setTimeout(function () {
        setStatus('正在启动 dsh web（窗口已最小化）…')
        window.location.href = 'dsh-launch://start?dir=' + encodeURIComponent(dir)
        waitReady(120, 1500).then(function (ok) {
          if (ok) { jumpIn() }
          else {
            stopSpout()
            setStatus('启动超时：请确认已运行 install.bat，并检查目录是否正确', true)
            busy = false
          }
        })
      }, SPOUT_MS)
    }).catch(function () {
      stopSpout()
      setStatus('检测失败，请重试', true)
      busy = false
    })
  })

  // 打开页面时如果服务已在运行，直接进入（#spout / #static 演示模式除外）
  if (location.hash === '' || location.hash === '#') {
    probe().then(function (up) { if (up) jumpIn() })
  }

  // #spout 演示模式：打开 launcher.html#spout 只播放喷水动画（不启动服务）
  if (location.hash === '#spout') {
    probe().then(function (up) {
      if (up) return
      wrap.classList.add('spouting')
      setStatus('喷水动画演示（#spout 模式）')
    })
  }

  // 用官方鲸鱼图形生成标签页/书签图标
  ;(function () {
    var d = document.querySelector('.fish path').getAttribute('d')
    var fav = document.createElement('link')
    fav.rel = 'icon'
    fav.type = 'image/svg+xml'
    fav.href = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 23.16 17.04" fill="none"><path d="' + d + '" fill="#1e80ff"/></svg>')
    document.head.appendChild(fav)
  })()
})()
</script>
</body>
</html>
